<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3ebd9">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/mark/primitive.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/anton-regular.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/notebook.css' | relative_url }}?v=primitive-1">
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header wrap">
    <a class="home-link" href="{{ '/' | relative_url }}" aria-label="Superposition home">{% include glyph.html shape="tally" %}<span>Superposition</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/journal/' | relative_url }}" {% if page.url == '/journal/' %}aria-current="page"{% endif %}>Journal</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="content" class="wrap" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wrap">
    <a href="{{ '/' | relative_url }}">Superposition</a><span>A visual journal</span>
    <a href="https://t.me/SuprPosition">Say hello <span aria-hidden="true">↗</span></a>
  </footer>
</body>
</html>
