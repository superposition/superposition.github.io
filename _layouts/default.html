<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0a0d">
  {% seo %}
  {% feed_meta %}
  {% include jsonld.html %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/mark/primitive.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/anton-regular.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/tokens.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/notebook.css' | relative_url }}?v=3">
  {% if page.math %}
  <script>window.MathJax={tex:{inlineMath:[["$","$"],["\\(","\\)"]],displayMath:[["$$","$$"],["\\[","\\]"]],processEscapes:true},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="site-header wide">
    <a class="home-link" href="{{ '/' | relative_url }}">Superposition</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/projects/' | relative_url }}" {% if page.url == '/projects/' or page.collection == 'repos' %}aria-current="page"{% endif %}>Repositories</a>
      <a href="{{ '/journal/' | relative_url }}" {% if page.url == '/journal/' or page.collection == 'posts' %}aria-current="page"{% endif %}>Journal</a>
      <a href="{{ '/topics/' | relative_url }}" {% if page.url == '/topics/' %}aria-current="page"{% endif %}>Topics</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>About</a>
    </nav>
  </header>
  <main id="content" tabindex="-1">{{ content }}</main>
  <footer class="site-footer wide">
    <div class="wrap">
      <p>Superposition · {{ site.subtitle }}</p>
      <p><a href="{{ '/feed.xml' | relative_url }}">RSS</a> <span aria-hidden="true">/</span> <a href="https://github.com/superposition">GitHub</a> <span aria-hidden="true">/</span> <a href="{{ '/credits/' | relative_url }}">Image credits</a> <span aria-hidden="true">/</span> <a href="{{ '/style/' | relative_url }}">Design system</a> <span aria-hidden="true">/</span> <a href="https://t.me/SuprPosition">Say hello</a></p>
    </div>
  </footer>
</body>
</html>
