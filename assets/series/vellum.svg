<svg xmlns="http://www.w3.org/2000/svg" width="320" height="400" viewBox="0 0 320 400" role="img" aria-labelledby="series-vellum-title">
  <title id="series-vellum-title">Vellum-6, the ship's archive unit: a wide flat lamp head with an amber light bar and a cyan indicator, a narrow cream body holding a loop of paper tape, standing on a tall pedestal.</title>
  <g stroke="#0b0a0d" stroke-width="7" stroke-linejoin="miter">
    <!-- arms -->
    <rect x="86" y="184" width="26" height="94" fill="#E6DCC8"/>
    <rect x="208" y="184" width="26" height="94" fill="#E6DCC8"/>
    <!-- pedestal -->
    <path d="M96 296 L224 296 L236 322 L84 322 Z" fill="#E6DCC8"/>
    <rect x="116" y="322" width="88" height="24" fill="#E6DCC8"/>
    <path d="M116 330 L204 330" stroke="#0b0a0d" stroke-width="5"/>
    <!-- torso -->
    <path d="M112 172 L208 172 L208 284 L196 296 L124 296 L112 284 Z" fill="#E6DCC8"/>
    <!-- chest ledger panel -->
    <rect x="128" y="190" width="64" height="82" fill="#0b0a0d"/>
    <g stroke="none">
      <rect x="138" y="202" width="44" height="6" fill="#FFC24A"/>
      <rect x="138" y="218" width="44" height="6" fill="#FFC24A"/>
      <rect x="138" y="234" width="44" height="6" fill="#FFC24A"/>
      <rect x="138" y="250" width="26" height="6" fill="#FFC24A"/>
      <circle cx="172" cy="258" r="7" fill="#8FD3FF"/>
    </g>
    <!-- neck -->
    <rect x="148" y="152" width="24" height="22" fill="#0b0a0d" stroke="none"/>
    <!-- head slab -->
    <path d="M56 84 L264 84 L278 98 L278 138 L264 152 L56 152 L42 138 L42 98 Z" fill="#E6DCC8"/>
    <rect x="62" y="100" width="196" height="36" fill="#0b0a0d"/>
    <g stroke="none">
      <rect x="74" y="110" width="148" height="16" fill="#FFC24A"/>
      <rect x="228" y="103" width="22" height="26" fill="#8FD3FF"/>
      <rect x="74" y="130" width="140" height="5" fill="#8FD3FF"/>
    </g>
    <!-- eye studs on the housing -->
    <g stroke="none">
      <rect x="50" y="90" width="10" height="10" fill="#FFC24A"/>
      <rect x="260" y="90" width="10" height="10" fill="#FFC24A"/>
    </g>
  </g>
  <!-- paper tape loop: dark casing first, then the cream ribbon -->
  <path d="M206 232 C254 254 250 306 208 300 C178 296 184 256 206 248" fill="none" stroke="#0b0a0d" stroke-width="26" stroke-linecap="round"/>
  <path d="M206 232 C254 254 250 306 208 300 C178 296 184 256 206 248" fill="none" stroke="#E6DCC8" stroke-width="13" stroke-linecap="round"/>
  <g fill="#FFC24A" stroke="none">
    <circle cx="234" cy="258" r="4"/>
    <circle cx="243" cy="284" r="4"/>
    <circle cx="196" cy="288" r="4"/>
  </g>
</svg>
