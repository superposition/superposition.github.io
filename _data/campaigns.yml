# Superposition Pictures: one campaign per repository page, in programme order.
#
# `slug` is the join: it must match a document in the `repos` collection, which
# is what the poster links to and what its cast is credited against. Nothing
# here is a capability claim the repository does not make on its own page.
#
#   title    the library's own name, set as the film title (uppercase on the
#            poster, so write it here the way a reader would say it)
#   film     the film-style subtitle, the line under the title
#   genre    one or two words, dry
#   runtime  the trailer card's figure: how long the film runs, invented
#   logline  twenty words or fewer, read off what the library actually does
#            (`node scripts/check-campaigns.mjs` counts them and fails over 20)
#   cast     the parts in the film, in billing order. These are roles, not
#            characters: when _data/cast.yml lands, an entry whose `library`
#            matches this slug and whose `role` matches one of these takes the
#            credit and brings a portrait with it. Until then the role is the
#            credit, which is how a one-sheet reads when the cast is unannounced.
#   stills   one to three images that already exist on the site: the repository's
#            own figures, or the NASA imagery the site already licenses. The
#            first is the poster's key art.
#
- slug: bend-ml-lab
  title: bend-ml-lab
  film: The same loop, three runtimes
  genre: Documentary
  runtime: 1h 06m
  logline: "Einsum, training epochs and weight diagnostics in Bend 2, measured against C and NumPy twins."
  cast: [the einsum, the twin, the epoch]
  stills:
    - src: /assets/art/galaxy/andromeda-960.webp
      alt: "A panoramic field of stars in Andromeda."
      credit: NASA/JPL-Caltech

