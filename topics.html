---
layout: page
title: Topics
permalink: /topics/
description: Follow a thread across the notebook.
---
{% assign tags = site.tags | sort %}
<div class="topic-grid">
  {% for tag in tags %}
  <section class="topic-card" id="{{ tag[0] | slugify }}">
    <h2>{{ tag[0] }}</h2>
    <ul>
      {% for post in tag[1] %}
      <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><span class="meta">{{ post.date | date: "%d %b %Y" }}</span></li>
      {% endfor %}
    </ul>
  </section>
  {% endfor %}
</div>
