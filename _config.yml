title: Superposition
subtitle: An open notebook
description: Thinking above the code. Notes on AI, mathematics, kernels, and the directions they open.
url: https://superposition.github.io
baseurl: ""
repository_url: https://github.com/superposition/superposition.github.io
author: Superposition
timezone: America/New_York
permalink: /journal/:title/
plugins: [jekyll-feed, jekyll-seo-tag]
markdown: kramdown
kramdown:
  math_engine: mathjax
defaults:
  - scope: {path: ""}
    values: {layout: page}
  - scope: {path: "", type: posts}
    values: {layout: post}
navigation:
  - {title: Journal, url: /journal/}
  - {title: Projects, url: /projects/}
  - {title: Topics, url: /topics/}
  - {title: About, url: /about/}
exclude: [Gemfile, Gemfile.lock, README.md, vendor, scripts]
