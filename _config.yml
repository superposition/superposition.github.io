title: Superposition
subtitle: Data informatics, AI, matrices, kinematics, cryptographic proofs
description: Notes on mathematics, AI, and the systems behind them.
url: https://superposition.github.io
baseurl: ""
repository_url: https://github.com/superposition/superposition.github.io
author: Superposition
timezone: America/New_York
permalink: /journal/:title/
collections:
  repos:
    output: true
    permalink: /projects/:slug/
plugins: [jekyll-feed, jekyll-seo-tag]
markdown: kramdown
kramdown:
  math_engine: ~
  syntax_highlighter: rouge
defaults:
  - scope: {path: ""}
    values: {layout: page}
  - scope: {path: "", type: posts}
    values: {layout: post, math: true, motion: rail}
  - scope: {path: "", type: repos}
    values: {layout: repo, motion: reveal}
exclude: [Gemfile, Gemfile.lock, README.md, vendor, scripts, node_modules, storybook]
