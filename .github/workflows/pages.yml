name: GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: .
      - name: Build
        working-directory: .
        run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: site-preview
          path: ./_site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./_site
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: storybook/package-lock.json
      - name: Install
        working-directory: storybook
        run: npm ci
      - name: Build the workbench
        working-directory: storybook
        run: npm run build-storybook
      - name: Measure contrast
        working-directory: storybook
        run: npm run contrast
      - name: Install a browser
        working-directory: storybook
        run: npx playwright install --with-deps chromium
      - name: Accessibility
        working-directory: storybook
        run: npm run a11y
      - name: Interaction tests
        working-directory: storybook
        run: npm run test
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
